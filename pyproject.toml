[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
description = "A Python-based AI agent"
requires-python = ">=3.11"
dependencies = [
    "copilotkit>=0.1.89",
    "fastapi>=0.136.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.47.0",
]

[tool.setuptools.packages.find]
where = ["src"]
