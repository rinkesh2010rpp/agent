[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
description = "A Python-based AI agent"
requires-python = ">=3.11"
dependencies = [
    "ag-ui-langgraph[fastapi]",
    "deepagents",
    "fastapi",
    "langchain-openai",
    "langgraph",
    "python-dotenv",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]
